name: "Energy AI"
version: "1.0.109"
slug: "energy_ai"
description: "Energy AI forecasts, optimization, model selection and explicitly armed deterministic Solinteg actuation for Home Assistant."
stage: experimental
init: false

arch:
  - aarch64
  - amd64

homeassistant_api: true
hassio_api: true
hassio_role: default

ingress: true
ingress_port: 8099
panel_icon: "mdi:home-lightning-bolt"
panel_title: "Energy AI"
panel_admin: true

map:
  - type: addon_config
    read_only: false

backup: hot

options:
  poll_seconds: 60
  stale_after_seconds: 180

  entity_pv_power: "sensor.solinteg_inverter_pv_power_total"
  entity_house_load: "sensor.solinteg_inverter_house_total_load"
  entity_grid_power: "sensor.solinteg_inverter_meter_active_power"
  entity_battery_power: "sensor.solinteg_inverter_battery_power"
  entity_battery_soc: "sensor.solinteg_inverter_battery_soc"
  entity_spot_price: "sensor.nord_pool_se4_aktuellt_pris"
  entity_solinteg_working_mode: ""
  entity_solinteg_battery_power_target: ""

  actuator_control_working_mode: "EMS BattCtrl"
  actuator_safe_working_mode: "General"
  actuator_ack_timeout_seconds: 8.0
  actuator_ack_tolerance_kw: 0.1
  actuator_state_max_age_seconds: 180.0
  actuator_candidate_grace_seconds: 120.0
  actuator_soc_guard_margin_pct: 1.0
  actuator_zero_deadband_kw: 0.05
  actuator_min_action_change_kw: 0.1
  actuator_watchdog_poll_seconds: 30.0
  actuator_max_physical_command_kw: 8.0

  sauna_default_duration_minutes: 120

schema:
  poll_seconds: int(10,3600)
  stale_after_seconds: int(30,3600)

  entity_pv_power: str
  entity_house_load: str
  entity_grid_power: str
  entity_battery_power: str
  entity_battery_soc: str
  entity_spot_price: str
  entity_solinteg_working_mode: str?
  entity_solinteg_battery_power_target: str?

  actuator_control_working_mode: str
  actuator_safe_working_mode: str
  actuator_ack_timeout_seconds: float(1,60)
  actuator_ack_tolerance_kw: float(0.01,5)
  actuator_state_max_age_seconds: float(30,900)
  actuator_candidate_grace_seconds: float(0,900)
  actuator_soc_guard_margin_pct: float(0,10)
  actuator_zero_deadband_kw: float(0,2)
  actuator_min_action_change_kw: float(0,2)
  actuator_watchdog_poll_seconds: float(10,600)
  actuator_max_physical_command_kw: float(0,8) # Legacy compatibility only; ignored by the runtime.

  sauna_default_duration_minutes: int(15,360)
