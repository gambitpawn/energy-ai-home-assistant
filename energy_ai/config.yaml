name: "Energy AI"
version: "1.0.81"
slug: "energy_ai"
description: "Read-only energy AI, forecasts, deterministic shadow planning, history and LLM analysis for Home Assistant."
stage: experimental
init: false

arch:
  - aarch64
  - amd64

homeassistant_api: true
hassio_api: true
hassio_role: default

ingress: true
ingress_port: 8099
panel_icon: "mdi:home-lightning-bolt"
panel_title: "Energy AI"
panel_admin: true

map:
  - type: addon_config
    read_only: false

backup: hot

options:
  poll_seconds: 60
  stale_after_seconds: 180

  entity_pv_power: "sensor.solinteg_inverter_pv_power_total"
  entity_house_load: "sensor.solinteg_inverter_house_total_load"
  entity_grid_power: "sensor.solinteg_inverter_meter_active_power"
  entity_battery_power: "sensor.solinteg_inverter_battery_power"
  entity_battery_soc: "sensor.solinteg_inverter_battery_soc"
  entity_spot_price: "sensor.nord_pool_se4_aktuellt_pris"

  entity_ev_power: "sensor.zap361270_laddeffekt"
  entity_ev_connected: "sensor.zap361270_laddstatus"
  entity_ev_soc: ""
  entity_ev_target_soc: ""
  entity_ev_ready_by: ""
  entity_sauna_power: ""
  entity_spa_power: ""
  entity_spa_temperature: ""
  entity_pool_heat_pump_power: ""
  entity_pool_temperature: ""
  load_components_json: ""

  ev_max_power_kw: 11.0
  sauna_nominal_peak_kw: 6.0
  sauna_detection_step_kw: 4.0

  pv_capacity_kw: 10.0
  pv_tilt_deg: 35.5
  pv_azimuth_deg: -79.0

  battery_capacity_kwh: 19.6
  hard_min_soc_pct: 5
  preferred_min_soc_pct: 15
  preferred_max_soc_pct: 90
  normal_reserve_soc_pct: 20
  high_uncertainty_reserve_soc_pct: 28

  # Authoritative grid-energy economics from 1.0.79.
  # Fixed import component defaults to the Swedish energy tax from 2026-01-01:
  # 36.00 ore/kWh excluding VAT. Override this value if the installation has
  # additional fixed per-kWh import components that should be included.
  import_fixed_including_energy_tax_ore_kwh: 36.0
  import_spot_percentage: 6.86
  export_fixed_compensation_ore_kwh: 2.84
  export_spot_percentage: 6.05
  economics_valid_from: ""

  # Legacy compatibility fields retained for migration of existing installs.
  import_overhead_ore_kwh: 0
  export_overhead_ore_kwh: 0
  minimum_arbitrage_margin_ore_kwh: 20

  optimizer_battery_max_charge_kw: 8.0
  optimizer_battery_max_discharge_kw: 8.0
  optimizer_battery_charge_efficiency: 0.95
  optimizer_battery_discharge_efficiency: 0.95
  optimizer_battery_degradation_ore_kwh: 5.0
  optimizer_physical_grid_import_limit_kw: 13.8
  optimizer_grid_export_limit_kw: 10.0
  optimizer_soc_grid_step_kwh: 0.5
  optimizer_reserve_critical_soc_pct: 10.0
  optimizer_reserve_critical_penalty_ore_per_kwh_hour: 300.0
  optimizer_reserve_preferred_penalty_ore_per_kwh_hour: 100.0
  optimizer_reserve_target_penalty_ore_per_kwh_hour: 10.0
  optimizer_preferred_max_excess_penalty_ore_per_kwh_hour: 2.0
  optimizer_reserve_uncertainty_full_scale_kw: 3.0
  optimizer_terminal_soc_tolerance_pct: 3.0
  optimizer_terminal_soc_tiebreak_ore_per_kwh: 5.0
  optimizer_unknown_price_energy_coverage_fraction: 0.35
  optimizer_unknown_price_risk_premium_ore_kwh: 40.0
  optimizer_unknown_price_default_continuation_value_ore_kwh: 150.0

  tariff_enabled: false
  tariff_consumption_enabled: false
  tariff_consumption_rate_sek_per_kw: 105.0
  tariff_consumption_start_hour: 7
  tariff_consumption_end_hour: 19
  tariff_consumption_active_months: "1,2,11,12"
  tariff_consumption_day_rule: "workdays"
  tariff_production_enabled: false
  tariff_production_rate_sek_per_kw: 10.0
  tariff_production_start_hour: 8
  tariff_production_end_hour: 16
  tariff_production_active_months: "4,5,6,7,8"
  tariff_production_day_rule: "weekends_holidays_midsummer_eve"

  llm_enabled: true
  openai_api_key: ""
  openai_model: "gpt-5.6-luna"

  ha_access_token: ""
  ha_base_url: "http://homeassistant.local"

schema:
  poll_seconds: "int(15,900)"
  stale_after_seconds: "int(30,3600)"

  entity_pv_power: str
  entity_house_load: str
  entity_grid_power: str
  entity_battery_power: str
  entity_battery_soc: str
  entity_spot_price: str

  entity_ev_power: str
  entity_ev_connected: str
  entity_ev_soc: str
  entity_ev_target_soc: str
  entity_ev_ready_by: str
  entity_sauna_power: str
  entity_spa_power: str
  entity_spa_temperature: str
  entity_pool_heat_pump_power: str
  entity_pool_temperature: str
  load_components_json: str

  ev_max_power_kw: "float(0,22)"
  sauna_nominal_peak_kw: "float(0,15)"
  sauna_detection_step_kw: "float(0,15)"

  pv_capacity_kw: "float(0.1,100)"
  pv_tilt_deg: "float(0,90)"
  pv_azimuth_deg: "float(-180,180)"

  battery_capacity_kwh: float
  hard_min_soc_pct: "float(0,50)"
  preferred_min_soc_pct: "float(5,60)"
  preferred_max_soc_pct: "float(50,100)"
  normal_reserve_soc_pct: "float(5,70)"
  high_uncertainty_reserve_soc_pct: "float(5,80)"

  import_fixed_including_energy_tax_ore_kwh: "float(-500,500)"
  import_spot_percentage: "float(-100,500)"
  export_fixed_compensation_ore_kwh: "float(-500,500)"
  export_spot_percentage: "float(-100,500)"
  economics_valid_from: str
  import_overhead_ore_kwh: float
  export_overhead_ore_kwh: float
  minimum_arbitrage_margin_ore_kwh: "float(0,500)"

  optimizer_battery_max_charge_kw: "float(0,15)"
  optimizer_battery_max_discharge_kw: "float(0,15)"
  optimizer_battery_charge_efficiency: "float(0.5,1)"
  optimizer_battery_discharge_efficiency: "float(0.5,1)"
  optimizer_battery_degradation_ore_kwh: "float(0,100)"
  optimizer_physical_grid_import_limit_kw: "float(0,30)"
  optimizer_grid_export_limit_kw: "float(0,30)"
  optimizer_soc_grid_step_kwh: "float(0.1,2)"
  optimizer_reserve_critical_soc_pct: "float(5,30)"
  optimizer_reserve_critical_penalty_ore_per_kwh_hour: "float(0,2000)"
  optimizer_reserve_preferred_penalty_ore_per_kwh_hour: "float(0,1000)"
  optimizer_reserve_target_penalty_ore_per_kwh_hour: "float(0,1000)"
  optimizer_preferred_max_excess_penalty_ore_per_kwh_hour: "float(0,500)"
  optimizer_reserve_uncertainty_full_scale_kw: "float(0.1,20)"
  optimizer_terminal_soc_tolerance_pct: "float(0,20)"
  optimizer_terminal_soc_tiebreak_ore_per_kwh: "float(0,500)"
  optimizer_unknown_price_energy_coverage_fraction: "float(0,1)"
  optimizer_unknown_price_risk_premium_ore_kwh: "float(0,500)"
  optimizer_unknown_price_default_continuation_value_ore_kwh: "float(0,1000)"

  tariff_enabled: bool
  tariff_consumption_enabled: bool
  tariff_consumption_rate_sek_per_kw: "float(0,10000)"
  tariff_consumption_start_hour: "int(0,23)"
  tariff_consumption_end_hour: "int(1,24)"
  tariff_consumption_active_months: str
  tariff_consumption_day_rule: str
  tariff_production_enabled: bool
  tariff_production_rate_sek_per_kw: "float(0,10000)"
  tariff_production_start_hour: "int(0,23)"
  tariff_production_end_hour: "int(1,24)"
  tariff_production_active_months: str
  tariff_production_day_rule: str

  llm_enabled: bool
  openai_api_key: password
  openai_model: str

  ha_access_token: password
  ha_base_url: str
