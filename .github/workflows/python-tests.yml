name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/energy_ai
      ENERGY_AI_DB: /tmp/energy_ai_test.db
    defaults:
      run:
        working-directory: energy_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: energy_ai/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest numpy scipy scikit-learn
      - name: Compile application
        run: python -m compileall -q app
      - name: Run actuator regression tests
        run: python -m pytest -q tests/test_deterministic_actuator.py
      - name: Reset test database
        run: rm -f /tmp/energy_ai_test.db
      - name: Run full test suite
        run: python -m pytest -q tests
